ktor:
    application:
        modules:
            - ru.descend.ApplicationKt.module
    deployment:
        port: 8080
    rateLimiting:
        enabled: true
        global:
            requests: 100
            window: 60
        perUser:
            requests: 30
            window: 60
        paths:
            - path: "/api"
              requests: 50
              window: 60
