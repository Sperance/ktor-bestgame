# Авто-деплой сервера: каждый пуш в рабочую ветку - проверки контента, затем на VPS по SSH запускается
# /opt/exileforge/update.sh --update --keep-data --no-logs: код до последнего коммита ветки, пересборка Docker-образа,
# базы сохраняются, verify.sh и откат на прежнюю версию при неудаче.
# Секреты: DEPLOY_HOST (IP VPS), DEPLOY_SSH_KEY (из scripts/setup_deploy_key.sh). Включается переменной DEPLOY_ENABLED=true.
name: Deploy server

on:
  push:
    branches: [ "claude/tender-pasteur-a36kj2" ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Сломанный контент не уезжает на сервер: сборка образа на VPS идёт только после зелёных проверок.
      - name: Content and contract checks
        run: bash gradlew ktlintCheck :rules:ktlintCheck :rules:test test --tests LocalizationTest --tests AuthTest --tests IconsTest

      - name: Update the server on the VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          # Ключ на VPS привязан к одной команде (update.sh без вопросов): её код выхода - итог деплоя.
          ssh -i key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "root@$HOST" deploy

      - name: Forget the key
        if: always()
        run: rm -f key
