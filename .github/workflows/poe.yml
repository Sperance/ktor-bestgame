name: PoE catalog and crafting
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name poe-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec poe-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec poe-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec poe-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: ./gradlew test poeMongoTest installDist --stacktrace
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGO_DB: poe_integration_test
      - name: Summarize test results
        run: |
          python3 - <<'PYTEST'
          import pathlib, xml.etree.ElementTree as ET
          for task in ['test', 'poeMongoTest']:
              suites = [ET.parse(p).getroot() for p in pathlib.Path('build/test-results', task).glob('TEST-*.xml')]
              assert suites, task
              print(task, {key: sum(int(s.get(key, 0)) for s in suites) for key in ['tests', 'failures', 'errors', 'skipped']})
          PYTEST
      - name: Verify packaged startup and restart
        run: python3 scripts/smoke_server.py
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGO_DB: poe_startup_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poe-verification
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/tests/poeMongoTest
            build/test-results/poeMongoTest
            build/libs/*.jar
            build/startup-*.log
